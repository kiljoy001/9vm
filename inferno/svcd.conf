# Services run by svcd at boot (/n/host/svcd.conf).
#
#	name	command args...
#
# Remote execution on the rstyxd port, using EdDSA certificates,
# X25519 and XChaCha20-Poly1305 (monoauth(8)).  Init creates the signer
# key and the console user's certificate on first boot.
#
#	rcmd -e mono tcp!<host>!6668 echo hello
#
# The keyring/SSL alternative is "-a rc4_128"; for an unencrypted but
# still authenticated mono session, "-a mono" and "rcmd -e mono" are
# unchanged (there is no plaintext mode).
cpu	/dis/sh.dis -c 'listen -a mono tcp!*!6668 /dis/sh.dis /lib/cpusession.sh'

# A restart test: prints a line, sleeps three seconds, exits.
# tick	/dis/sh.dis -c 'echo tick; /dis/sleep.dis 3'

# Read-only file service over Styx.
# styx	/dis/sh.dis -c 'listen -a rc4_128 tcp!*!styx /dis/export /'
