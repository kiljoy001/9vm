# Services run by svcd at boot (/n/host/svcd.conf).
#
#	name	command args...
#
# Remote execution on the rstyxd port, authenticated with the signer
# key and certificate that init creates on first boot.  The client must
# use the same algorithm:
#
#	rcmd -e rc4_128 tcp!<host>!6668 echo hello
#
# For an unencrypted but still authenticated session, use "-a none".
cpu	/dis/sh.dis -c 'listen -a rc4_128 tcp!*!6668 /dis/sh.dis /lib/cpusession.sh'

# A restart test: prints a line, sleeps three seconds, exits.
# tick	/dis/sh.dis -c 'echo tick; /dis/sleep.dis 3'

# Read-only file service over Styx.
# styx	/dis/sh.dis -c 'listen -a rc4_128 tcp!*!styx /dis/export /'
