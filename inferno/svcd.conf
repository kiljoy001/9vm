# Services run by svcd at boot (/n/host/svcd.conf).
#
#	name	command args...
#
# Remote execution on the rstyxd port.  The client is cpu(1) or rcmd(1):
#	rcmd -A tcp!<host>!6668 echo hello
cpu	/dis/sh.dis -c 'listen -A tcp!*!6668 /dis/cpud.dis'

# A restart test: prints a line, sleeps three seconds, exits.
# tick	/dis/sh.dis -c 'echo tick; /dis/sleep.dis 3'

# Read-only file service over Styx.
# styx	/dis/sh.dis -c 'listen -s tcp!*!styx {export /&}'
